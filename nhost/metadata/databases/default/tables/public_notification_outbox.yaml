table:
  name: notification_outbox
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
event_triggers:
  - name: notify_outbox_deliver
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      num_retries: 5
      interval_sec: 15
      timeout_sec: 60
    webhook: "{{ACTION_BASE_URL}}/notify-handler"
    headers:
      - name: x-nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_run_id
        - step_run_id
        - channel
        - payload
        - status
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
